apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platforms-route
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: platforms-clusterip-srv
          port: 80